<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midnight Abyss – Official Site</title>
  <meta name="description" content="Midnight Abyss is a deep-sea survival RPG of oxygen, pressure, and discovery. Read the quickstart and explore the setting." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IM+Fell+English+SC&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #E5E5E5;
      --card: #F0F0F0;
      --ink: #1E1F22;
      --muted: #3A4046;
      --accent: #3C7AA0;
      --grid: rgba(60,122,160,0.06);
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --radius: 16px;
    }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;line-height:1.6}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}
    header{position:sticky;top:0;background:linear-gradient(180deg,rgba(229,229,229,0.95),rgba(229,229,229,0.8));backdrop-filter:saturate(140%) blur(6px);border-bottom:1px solid rgba(0,0,0,0.06);z-index:10}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:16px;text-decoration:none;color:var(--ink);flex:1 1 100%;flex-direction:column;margin-top:8px}
    .logo{width:84px;height:84px;object-fit:contain;border-radius:50%;box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 6px 18px rgba(0,0,0,0.2)}
    .title{font-family:'IM Fell English SC', serif;font-size:4rem;font-weight:400;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:0}
    nav{width:100%;display:flex;justify-content:center;flex-wrap:wrap;margin-top:10px}
    nav a{color:var(--muted);text-decoration:none;font-weight:600;margin:0 10px}
    nav a:hover{color:var(--accent)}
    .hero{position:relative;margin-top:18px;border-radius:var(--radius);overflow:hidden;background:
      radial-gradient(1000px 400px at 20% 0%, rgba(60,122,160,0.25), transparent 70%),
      radial-gradient(900px 300px at 100% 110%, rgba(156,106,88,0.18), transparent 70%),
      var(--card);
      border:1px solid rgba(0,0,0,0.06);box-shadow:var(--shadow)}
    .hero-inner{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding:42px}
    .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(60,122,160,0.09);padding:6px 10px;border-radius:999px;border:1px solid rgba(60,122,160,0.25)}
    h1{font-family:Gloock,serif;font-weight:400;line-height:1.15;margin:.4rem 0 1rem;color:var(--muted)}
    .lead{font-size:1.1rem;color:#2a2f35}
    .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
    .btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-weight:800;letter-spacing:.02em;background:var(--accent);color:white;box-shadow:0 6px 16px rgba(60,122,160,0.35);cursor:pointer}
    .btn.secondary{background:transparent;color:var(--accent);border:2px solid var(--accent)}
    .panel{background:var(--card);border:1px solid rgba(0,0,0,0.06);border-radius:var(--radius);box-shadow:var(--shadow)}
    .grid{display:grid;gap:22px}
    .grid.features{grid-template-columns:repeat(3,1fr)}
    .feature{padding:18px}
    .feature h3{margin:.2rem 0 .4rem;color:var(--muted)}
    .tag{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,0.04);padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,0.06);font-size:12px}
    .divider{height:1px;background:linear-gradient(90deg,transparent, rgba(0,0,0,0.1), transparent);margin:26px 0}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    figure.thumb{border-radius:12px;background:#ccc;position:relative;overflow:hidden;margin:0}
    figure.thumb img{width:100%;height:auto;display:block}
    figure.thumb figcaption{position:absolute;bottom:8px;right:10px;font-size:11px;color:#fff;background:rgba(0,0,0,0.45);padding:4px 8px;border-radius:999px}
    footer{margin:40px 0 22px;color:#5a6168;font-size:14px;text-align:center}
    .hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(transparent 31px, var(--grid) 32px), linear-gradient(90deg, transparent 31px, var(--grid) 32px);background-size:32px 32px;pointer-events:none}
    @media (max-width: 900px){
      .hero-inner{grid-template-columns:1fr}
      .grid.features{grid-template-columns:1fr}
      .two{grid-template-columns:1fr}
      .gallery{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="#">
        <img class="logo" src="logo.png" alt="Midnight Abyss logo" onerror="this.onerror=null;this.src='docs/logo.png'" />
        <strong class="title">Midnight Abyss</strong>
      </a>
      <nav aria-label="Primary">
        <a href="#about">About</a>
        <a href="#features">Features</a>
        <a href="#gallery">Gallery</a>
        <a href="#quickstart">Quickstart</a>
        <a href="#contact">Contact</a>
        <!-- Removed Contact Board link -->
      </nav>
    </div>
  </header>

  <!-- remainder of the file unchanged -->
